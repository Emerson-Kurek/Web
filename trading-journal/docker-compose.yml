# Local Postgres for development. Start with: docker compose up -d
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: journal
      POSTGRES_PASSWORD: journal
      POSTGRES_DB: trading_journal
    ports:
      - '5432:5432'
    volumes:
      - journal_pgdata:/var/lib/postgresql/data

volumes:
  journal_pgdata:
