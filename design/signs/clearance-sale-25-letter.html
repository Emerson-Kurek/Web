<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clearance sale table sign — $25.00 (US Letter)</title>
<style>
  /* ==========================================================
     Table sign · CLEARANCE SALE · $25.00
     US Letter portrait, 8.5 × 11 in, borderless-safe.

     The sheet is exactly 8.5 × 11in and @page margin is 0, so
     one sheet is one page with nothing to scale at print time.
     All artwork sits inside a 0.4in keepout, which clears the
     unprintable edge on every desk printer we have tested, so
     "Fit to page" and "Actual size" produce the same sign.
     ========================================================== */

  :root {
    --sheet-w: 8.5in;
    --sheet-h: 11in;

    /* the frame: outer keepout, then the rule pair */
    --keepout: 0.4in;      /* nothing prints outside this        */
    --rule-gap: 0.07in;    /* white between the two black rules  */
    --pad: 0.42in;         /* inner rule to type                 */

    --red: #cf0a2c;
    --ink: #111111;
    --paper: #ffffff;

    /* The three display lines are SVG with a fixed textLength, so
       they are stretched to the measure no matter which face the
       printing machine actually resolves. That is what keeps the
       sign identical on a Mac, a Windows box and a print shop RIP
       instead of reflowing on a missing condensed weight. */
    --display: "Helvetica Neue Condensed Black", "HelveticaNeue-CondensedBlack",
               "Arial Narrow", "Helvetica Neue", Helvetica, Arial, sans-serif;
    --text: "Helvetica Neue", Helvetica, Arial, sans-serif;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: #52545a;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }

  /* ---------- the sheet ---------- */

  .sheet {
    position: relative;
    width: var(--sheet-w);
    height: var(--sheet-h);
    margin: 0 auto;
    background: var(--paper);
    color: var(--ink);
    overflow: hidden;
  }

  /* screen only — centres the sheet and shows its edge */
  @media screen {
    body { padding: 24px 0; }
    .sheet { box-shadow: 0 8px 40px rgba(0, 0, 0, 0.5); }
  }

  /* ---------- frame ---------- */

  .rule-outer {
    position: absolute;
    inset: var(--keepout);
    border: 2.4px solid var(--ink);
  }

  .rule-inner {
    position: absolute;
    inset: calc(var(--keepout) + var(--rule-gap));
    border: 1.2px solid var(--ink);
  }

  /* the four register dots, tucked inside the inner rule */
  .dot {
    position: absolute;
    width: 0.075in;
    height: 0.075in;
    border-radius: 50%;
    background: var(--ink);
  }
  .dot.tl { top: 0.72in; left: 0.72in; }
  .dot.tr { top: 0.72in; right: 0.72in; }
  .dot.bl { bottom: 0.72in; left: 0.72in; }
  .dot.br { bottom: 0.72in; right: 0.72in; }

  /* ---------- content column ----------
     One flex column between the inner rule and the type pad.
     space-between does the vertical rhythm, so nothing needs a
     hand-tuned top margin and the sign stays balanced if a line
     is switched off. */

  .stack {
    position: absolute;
    inset: calc(var(--keepout) + var(--rule-gap));
    padding: var(--pad);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    text-align: center;
  }

  /* ---------- masthead ---------- */

  .masthead {
    border: 1.2px solid var(--ink);
    padding: 0.1in 0.34in 0.09in;
    font-family: var(--text);
    font-size: 11.5pt;
    font-weight: 700;
    letter-spacing: 0.13em;
    line-height: 1;
    white-space: nowrap;
  }

  /* ---------- headline ---------- */

  .headline {
    position: relative;
    width: 100%;
    padding: 0 0.3in;
  }

  .headline svg,
  .price svg {
    display: block;
    width: 100%;
    height: auto;
    overflow: visible;   /* the $ overshoots the digit box */
  }

  .headline text,
  .price text {
    font-family: var(--display);
    font-weight: 900;
    font-stretch: condensed;
    fill: var(--red);
  }

  /* the red brackets around the first headline line */
  .bracket {
    position: absolute;
    width: 0.42in;
    height: 0.62in;
    border: 3.4px solid var(--red);
  }
  .bracket.tl { top: 0;    left: 0;  border-right: 0; border-bottom: 0; }
  .bracket.tr { top: 0;    right: 0; border-left: 0;  border-bottom: 0; }
  .bracket.bl { top: 0.5in; left: 0;  border-right: 0; border-top: 0; }
  .bracket.br { top: 0.5in; right: 0; border-left: 0;  border-top: 0; }

  /* ---------- qualifier ---------- */

  .qualifier {
    font-family: var(--text);
    font-weight: 700;
    font-style: italic;
    font-size: 22pt;
    letter-spacing: 0.005em;
    line-height: 1;
    text-transform: uppercase;
    padding: 0.11in 0 0.06in;
    border-top: 2.6px solid var(--red);
    border-bottom: 2.2px solid var(--ink);
  }

  /* ---------- the price ---------- */

  .price-box {
    position: relative;
    width: 100%;
    border: 3px solid var(--red);
    border-radius: 0.17in;
    /* the side padding is what keeps the ring clear of the $ */
    padding: 0.2in 0.5in 0.26in;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .price {
    flex: 1;
    min-width: 0;
  }

  /* the small open ring sitting off the dollar sign */
  .ring {
    position: absolute;
    left: 0.22in;
    top: 50%;
    width: 0.14in;
    height: 0.14in;
    margin-top: -0.07in;
    border: 2px solid var(--red);
    border-radius: 50%;
  }

  /* ---------- the closer ---------- */

  .closer {
    position: relative;
    width: 100%;
    padding: 0.16in 0.3in;
    font-family: var(--text);
    font-weight: 700;
    font-style: italic;
    font-size: 27pt;
    line-height: 1;
    letter-spacing: 0.004em;
    color: var(--red);
    text-transform: uppercase;
    white-space: nowrap;
  }

  /* the ellipse is its own element so the type stays on the
     baseline and the ring can overshoot the measure */
  .ellipse {
    position: absolute;
    inset: 0;
    border: 2.6px solid var(--red);
    border-radius: 50%;
  }

  /* ---------- footer ---------- */

  .footer {
    font-family: var(--text);
    font-weight: 700;
    font-style: italic;
    font-size: 9.5pt;
    letter-spacing: 0.1em;
    line-height: 1;
    text-transform: uppercase;
    text-decoration: underline;
    text-underline-offset: 0.045in;
  }

  /* ---------- print ---------- */

  @page {
    size: 8.5in 11in;
    margin: 0;
  }

  @media print {
    html, body { background: #fff; padding: 0; }
    .sheet { box-shadow: none; break-inside: avoid; page-break-after: avoid; }
  }
</style>
</head>
<body>

<div class="sheet">

  <div class="rule-outer"></div>
  <div class="rule-inner"></div>

  <span class="dot tl"></span>
  <span class="dot tr"></span>
  <span class="dot bl"></span>
  <span class="dot br"></span>

  <div class="stack">

    <div class="masthead">Distinctive Lighting Concepts</div>

    <div class="headline">
      <span class="bracket tl"></span>
      <span class="bracket tr"></span>
      <span class="bracket bl"></span>
      <span class="bracket br"></span>
      <svg viewBox="0 0 1000 336" role="img" aria-label="Clearance sale">
        <text x="500" y="145" text-anchor="middle" font-size="190"
              textLength="1000" lengthAdjust="spacingAndGlyphs">CLEARANCE</text>
        <text x="500" y="324" text-anchor="middle" font-size="190"
              textLength="450" lengthAdjust="spacingAndGlyphs">SALE</text>
      </svg>
    </div>

    <div class="qualifier">All items on this table</div>

    <div class="price-box">
      <span class="ring"></span>
      <span class="price">
        <svg viewBox="0 0 1000 220" role="img" aria-label="Twenty five dollars">
          <text x="500" y="186" text-anchor="middle" font-size="239"
                textLength="1000" lengthAdjust="spacingAndGlyphs">$25.00</text>
        </svg>
      </span>
    </div>

    <div class="closer">
      <span class="ellipse"></span>
      Don&rsquo;t miss out
    </div>

    <div class="footer">While stock lasts</div>

  </div>
</div>

</body>
</html>
