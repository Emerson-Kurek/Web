<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blow out sale — $25 table sign</title>
<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    background: #23252a;
    color: #e8e6e1;
    display: flex;
    min-height: 100vh;
  }

  /* ============ DESIGN PANEL ============ */

  .panel {
    width: 340px;
    flex: none;
    background: #16181c;
    border-right: 1px solid #2e3238;
    height: 100vh;
    overflow-y: auto;
    padding: 0 0 40px;
  }

  .panel-head {
    position: sticky;
    top: 0;
    z-index: 5;
    background: #16181c;
    border-bottom: 1px solid #2e3238;
    padding: 16px 18px 14px;
  }

  .panel-head h1 {
    margin: 0 0 3px;
    font-size: 13px;
    letter-spacing: .14em;
    text-transform: uppercase;
    font-weight: 600;
  }

  .panel-head p { margin: 0; font-size: 11px; color: #8a8f98; line-height: 1.5; }

  .btnrow { display: flex; gap: 8px; margin-top: 12px; }

  button {
    font: inherit;
    font-size: 11px;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: #e8e6e1;
    background: #23262c;
    border: 1px solid #3a3f47;
    border-radius: 4px;
    padding: 7px 11px;
    cursor: pointer;
  }

  button:hover { border-color: #6f7681; }
  button.primary { background: #2f6fdd; border-color: #2f6fdd; }
  button.primary:hover { background: #3d7cea; }

  details {
    border-bottom: 1px solid #24272c;
  }

  summary {
    padding: 11px 18px;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: .04em;
    cursor: pointer;
    list-style: none;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  summary::-webkit-details-marker { display: none; }
  summary::after { content: "+"; color: #7a808a; font-size: 14px; }
  details[open] summary::after { content: "\2212"; }
  summary:hover { background: #1c1f24; }

  .group { padding: 4px 18px 16px; }

  .row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 8px;
  }

  .row label {
    flex: none;
    width: 92px;
    font-size: 11px;
    color: #949aa4;
  }

  .row input[type=text],
  .row input[type=number],
  .row select,
  .group textarea {
    flex: 1;
    min-width: 0;
    font: inherit;
    font-size: 12px;
    color: #e8e6e1;
    background: #0f1114;
    border: 1px solid #33383f;
    border-radius: 4px;
    padding: 6px 8px;
  }

  .group textarea {
    width: 100%;
    resize: vertical;
    line-height: 1.4;
    margin-bottom: 8px;
  }

  .row input[type=color] {
    flex: none;
    width: 38px;
    height: 30px;
    padding: 2px;
    background: #0f1114;
    border: 1px solid #33383f;
    border-radius: 4px;
    cursor: pointer;
  }

  .row input:focus, .row select:focus, textarea:focus {
    outline: none;
    border-color: #2f6fdd;
  }

  .hint {
    font-size: 10px;
    color: #6d737c;
    line-height: 1.5;
    margin: 0 0 10px;
  }

  .toggle {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 11px;
    color: #949aa4;
    margin-bottom: 10px;
  }

  /* ============ STAGE ============ */

  .stage {
    flex: 1;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 34px 24px 60px;
    overflow: auto;
  }

  .scaler { transform-origin: top left; }

  /* ============ THE SHEET ============ */

  .sheet {
    position: relative;
    width: 215.9mm;
    height: 279.4mm;
    background: #ffffff;
    overflow: hidden;
    box-shadow: 0 10px 40px rgba(0,0,0,.5);
  }

  .frame {
    position: absolute;
    pointer-events: none;
  }

  .content {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    padding: 18mm 14mm;
  }

  .el {
    white-space: pre-wrap;
    outline: none;
    margin: 0;
  }

  .el:focus { background: rgba(47, 111, 221, .12); }

  .grow { flex: 1 1 auto; }

  /* ---- phones: sign on top and stuck there, controls underneath,
     so you can see what a change did without scrolling ---- */
  @media (max-width: 820px) {
    body { flex-direction: column; -webkit-text-size-adjust: 100%; }

    /* min-width:0 on both — a flex item's automatic minimum size is
       its content, and the sheet is 816px wide before scaling, which
       would otherwise force the whole page wider than the screen */
    .stage {
      order: -1;
      position: sticky;
      top: 0;
      z-index: 20;
      width: 100%;
      min-width: 0;
      padding: 12px 12px 14px;
      background: #23252a;
      border-bottom: 1px solid #2e3238;
      overflow: hidden;
    }

    .panel {
      width: 100%;
      min-width: 0;
      height: auto;
      border-right: none;
    }

    .panel-head { position: static; }

    /* iOS zooms the whole page when you focus an input under 16px */
    .row input[type=text],
    .row input[type=number],
    .row select,
    .group textarea { font-size: 16px; padding: 9px 10px; }

    .row input[type=color] { width: 46px; height: 36px; }
    .row label { width: 86px; }
    summary { padding: 14px 18px; }
    button { padding: 10px 13px; }
  }

  @page { size: 215.9mm 279.4mm; margin: 0; }

  @media print {
    body { background: #fff; display: block; }
    .panel, .stage { all: unset; }
    .panel { display: none !important; }
    .stage { display: block; }
    .scaler { transform: none !important; width: auto !important; height: auto !important; }
    .sheet { box-shadow: none; }
    * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
</style>
</head>
<body>

<div class="panel">
  <div class="panel-head">
    <h1>Design</h1>
    <p>Change anything. Your edits save automatically and survive a refresh. You can also click text on the sign and type straight into it.</p>
    <div class="btnrow">
      <button class="primary" id="print">Print / PDF</button>
      <button id="reset">Reset all</button>
    </div>
  </div>

  <div id="controls"></div>
</div>

<div class="stage">
  <div class="scaler">
    <div class="sheet" id="sheet">
      <div class="frame" id="frame"></div>
      <div class="content" id="content"></div>
    </div>
  </div>
</div>

<script>
(function () {
  "use strict";

  var FONTS = {
    "Helvetica / Arial": '"Helvetica Neue", Helvetica, Arial, sans-serif',
    "Georgia / serif":   'Georgia, "Times New Roman", Times, serif',
    "Palatino":          '"Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif',
    "Courier / mono":    '"Courier New", Courier, monospace',
    "Impact":            'Impact, "Haettenschweiler", "Arial Narrow Bold", sans-serif',
    "Trebuchet":         '"Trebuchet MS", Tahoma, sans-serif',
    "Verdana":           'Verdana, Geneva, sans-serif'
  };

  // Each line on the sign. Order here is the order down the page.
  var LINES = [
    { key: "store",  name: "Store name",
      text: "Distinctive Lighting Concepts",
      size: 4.5, color: "#3d3d3d", weight: "600", track: 0.28, leading: 1.2, align: "center", space: 0, on: true },

    { key: "title",  name: "Headline",
      text: "BLOW OUT\nSALE",
      size: 26, color: "#c8102e", weight: "700", track: 0.02, leading: 0.98, align: "center", space: 10, on: true },

    { key: "sub",    name: "Sub line",
      text: "ALL ITEMS ON THIS TABLE",
      size: 8.5, color: "#17181a", weight: "700", track: 0.06, leading: 1.2, align: "center", space: 9, on: true },

    { key: "price",  name: "Price",
      text: "$25.00",
      size: 52, color: "#c8102e", weight: "700", track: -0.02, leading: 1, align: "center", space: 10, on: true },

    { key: "tag",    name: "Bottom line",
      text: "GREAT DEALS",
      size: 14, color: "#1f6b45", weight: "700", track: 0.08, leading: 1.1, align: "center", space: 10, on: true },

    { key: "note",   name: "Small note",
      text: "While stock lasts",
      size: 4.5, color: "#666666", weight: "500", track: 0.16, leading: 1.2, align: "center", space: 8, on: false }
  ];

  var SHEET = {
    paper: "#ffffff",
    font: "Helvetica / Arial",
    size: "letter",
    padX: 14,
    padY: 18,
    spread: "spread",
    frameOn: true,
    frameColor: "#17181a",
    frameWidth: 1.2,
    frameInset: 10,
    frameDouble: true
  };

  var SIZES = {
    letter: [215.9, 279.4],
    a4:     [210, 297],
    half:   [139.7, 215.9],
    square: [210, 210]
  };

  var STORE_KEY = "blowout25.v1";
  var state = load();

  function defaults() {
    return { lines: JSON.parse(JSON.stringify(LINES)), sheet: JSON.parse(JSON.stringify(SHEET)) };
  }

  function load() {
    try {
      var raw = localStorage.getItem(STORE_KEY);
      if (!raw) return defaults();
      var saved = JSON.parse(raw), base = defaults();
      // merge, so new controls added later still get their defaults
      base.lines.forEach(function (ln, i) {
        var s = (saved.lines || []).filter(function (x) { return x.key === ln.key; })[0];
        if (s) base.lines[i] = Object.assign(ln, s);
      });
      Object.assign(base.sheet, saved.sheet || {});
      return base;
    } catch (e) { return defaults(); }
  }

  function save() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) {}
  }

  // ---------- render the sign ----------

  var sheetEl = document.getElementById("sheet");
  var frameEl = document.getElementById("frame");
  var contentEl = document.getElementById("content");

  function draw() {
    var s = state.sheet;
    var dims = SIZES[s.size] || SIZES.letter;

    sheetEl.style.width = dims[0] + "mm";
    sheetEl.style.height = dims[1] + "mm";
    sheetEl.style.background = s.paper;
    sheetEl.style.fontFamily = FONTS[s.font] || FONTS["Helvetica / Arial"];

    contentEl.style.padding = s.padY + "mm " + s.padX + "mm";
    contentEl.style.justifyContent =
      s.spread === "top" ? "flex-start" :
      s.spread === "middle" ? "center" :
      s.spread === "bottom" ? "flex-end" : "flex-start";

    frameEl.style.display = s.frameOn ? "block" : "none";
    frameEl.style.inset = s.frameInset + "mm";
    frameEl.style.border = s.frameWidth + "mm solid " + s.frameColor;
    frameEl.style.boxShadow = s.frameDouble
      ? "inset 0 0 0 " + (s.frameWidth * 1.8) + "mm " + s.paper +
        ", inset 0 0 0 " + (s.frameWidth * 2.2) + "mm " + s.frameColor
      : "none";

    // rebuild the lines
    contentEl.innerHTML = "";
    state.lines.forEach(function (ln, i) {
      if (!ln.on) return;
      if (state.sheet.spread === "spread" && i > 0) {
        var g = document.createElement("div");
        g.className = "grow";
        contentEl.appendChild(g);
      }
      var el = document.createElement("div");
      el.className = "el";
      el.id = "el-" + ln.key;
      el.setAttribute("contenteditable", "true");
      el.textContent = ln.text;
      el.style.fontSize = ln.size + "mm";
      el.style.color = ln.color;
      el.style.fontWeight = ln.weight;
      el.style.letterSpacing = ln.track + "em";
      el.style.lineHeight = ln.leading;
      el.style.textAlign = ln.align;
      el.style.marginTop = (i === 0 ? 0 : ln.space) + "mm";
      // letter-spacing pads the right of the last glyph; nudge centred
      // text back so it looks optically centred
      el.style.textIndent = (ln.align === "center" ? ln.track : 0) + "em";
      el.addEventListener("input", function () {
        ln.text = el.textContent;
        var ta = document.getElementById("ta-" + ln.key);
        if (ta) ta.value = ln.text;
        save();
      });
      contentEl.appendChild(el);
    });

    if (state.sheet.spread === "spread") {
      var tail = document.createElement("div");
      tail.className = "grow";
      contentEl.appendChild(tail);
    }

    fit();
  }

  function fit() {
    var scaler = document.querySelector(".scaler");
    var stage = document.querySelector(".stage");
    var phone = window.matchMedia("(max-width: 820px)").matches;
    var availW = stage.clientWidth - (phone ? 24 : 48);
    var k = Math.min(1, availW / sheetEl.offsetWidth);

    // on a phone the sign is pinned to the top of the screen, so it
    // also has to fit the height it is allowed to occupy
    if (phone) {
      var availH = window.innerHeight * 0.44;
      k = Math.min(k, availH / sheetEl.offsetHeight);
    }

    // scaling with a transform leaves the element's layout box at full
    // size, which would push the page wider than a phone screen — so the
    // box is resized to the scaled dimensions as well
    scaler.style.transform = "scale(" + k + ")";
    scaler.style.width = (sheetEl.offsetWidth * k) + "px";
    scaler.style.height = (sheetEl.offsetHeight * k) + "px";
  }

  window.addEventListener("resize", fit);

  // ---------- build the panel ----------

  var controls = document.getElementById("controls");

  function row(label, node) {
    var r = document.createElement("div");
    r.className = "row";
    var l = document.createElement("label");
    l.textContent = label;
    r.appendChild(l);
    r.appendChild(node);
    return r;
  }

  function input(type, value, step, onchange) {
    var i = document.createElement("input");
    i.type = type;
    i.value = value;
    if (step != null) { i.step = step; }
    i.addEventListener("input", function () { onchange(i.value); });
    return i;
  }

  function select(options, value, onchange) {
    var s = document.createElement("select");
    options.forEach(function (o) {
      var opt = document.createElement("option");
      opt.value = (typeof o === "string") ? o : o[0];
      opt.textContent = (typeof o === "string") ? o : o[1];
      s.appendChild(opt);
    });
    s.value = value;
    s.addEventListener("change", function () { onchange(s.value); });
    return s;
  }

  function section(title, open) {
    var d = document.createElement("details");
    if (open) d.open = true;
    var sm = document.createElement("summary");
    sm.textContent = title;
    d.appendChild(sm);
    var g = document.createElement("div");
    g.className = "group";
    d.appendChild(g);
    controls.appendChild(d);
    return g;
  }

  function buildPanel() {
    controls.innerHTML = "";

    // ---- a section per line ----
    state.lines.forEach(function (ln, idx) {
      var g = section(ln.name, idx < 4);

      var t = document.createElement("label");
      t.className = "toggle";
      var cb = document.createElement("input");
      cb.type = "checkbox";
      cb.checked = ln.on;
      cb.addEventListener("change", function () { ln.on = cb.checked; save(); draw(); });
      t.appendChild(cb);
      t.appendChild(document.createTextNode("Show this line"));
      g.appendChild(t);

      var ta = document.createElement("textarea");
      ta.id = "ta-" + ln.key;
      ta.rows = ln.key === "title" ? 3 : 2;
      ta.value = ln.text;
      ta.addEventListener("input", function () {
        ln.text = ta.value;
        var el = document.getElementById("el-" + ln.key);
        if (el && document.activeElement !== el) el.textContent = ln.text;
        save();
      });
      g.appendChild(ta);

      var hint = document.createElement("p");
      hint.className = "hint";
      hint.textContent = "Press Enter inside the box for a new line.";
      g.appendChild(hint);

      g.appendChild(row("Size (mm)", input("number", ln.size, "0.5", function (v) {
        ln.size = parseFloat(v) || 0; save(); draw();
      })));
      g.appendChild(row("Colour", input("color", ln.color, null, function (v) {
        ln.color = v; save(); draw();
      })));
      g.appendChild(row("Weight", select(
        [["400", "Normal"], ["500", "Medium"], ["600", "Semibold"], ["700", "Bold"], ["900", "Black"]],
        ln.weight, function (v) { ln.weight = v; save(); draw(); })));
      g.appendChild(row("Align", select(
        [["left", "Left"], ["center", "Centre"], ["right", "Right"]],
        ln.align, function (v) { ln.align = v; save(); draw(); })));
      g.appendChild(row("Letter space", input("number", ln.track, "0.01", function (v) {
        ln.track = parseFloat(v) || 0; save(); draw();
      })));
      g.appendChild(row("Line height", input("number", ln.leading, "0.02", function (v) {
        ln.leading = parseFloat(v) || 1; save(); draw();
      })));
      g.appendChild(row("Gap above (mm)", input("number", ln.space, "1", function (v) {
        ln.space = parseFloat(v) || 0; save(); draw();
      })));
    });

    // ---- the sheet itself ----
    var s = state.sheet;
    var g2 = section("Paper & layout", false);

    g2.appendChild(row("Paper size", select(
      [["letter", "US Letter"], ["a4", "A4"], ["half", "Half letter"], ["square", "Square 210mm"]],
      s.size, function (v) { s.size = v; save(); draw(); })));
    g2.appendChild(row("Paper colour", input("color", s.paper, null, function (v) {
      s.paper = v; save(); draw();
    })));
    g2.appendChild(row("Font", select(Object.keys(FONTS), s.font, function (v) {
      s.font = v; save(); draw();
    })));
    g2.appendChild(row("Spacing", select(
      [["spread", "Spread evenly"], ["top", "Stack from top"], ["middle", "Stack in middle"], ["bottom", "Stack at bottom"]],
      s.spread, function (v) { s.spread = v; save(); draw(); })));
    g2.appendChild(row("Margin side", input("number", s.padX, "1", function (v) {
      s.padX = parseFloat(v) || 0; save(); draw();
    })));
    g2.appendChild(row("Margin top", input("number", s.padY, "1", function (v) {
      s.padY = parseFloat(v) || 0; save(); draw();
    })));

    var g3 = section("Border", false);
    var t3 = document.createElement("label");
    t3.className = "toggle";
    var cb3 = document.createElement("input");
    cb3.type = "checkbox";
    cb3.checked = s.frameOn;
    cb3.addEventListener("change", function () { s.frameOn = cb3.checked; save(); draw(); });
    t3.appendChild(cb3);
    t3.appendChild(document.createTextNode("Show border"));
    g3.appendChild(t3);

    var t4 = document.createElement("label");
    t4.className = "toggle";
    var cb4 = document.createElement("input");
    cb4.type = "checkbox";
    cb4.checked = s.frameDouble;
    cb4.addEventListener("change", function () { s.frameDouble = cb4.checked; save(); draw(); });
    t4.appendChild(cb4);
    t4.appendChild(document.createTextNode("Double line"));
    g3.appendChild(t4);

    g3.appendChild(row("Colour", input("color", s.frameColor, null, function (v) {
      s.frameColor = v; save(); draw();
    })));
    g3.appendChild(row("Thickness", input("number", s.frameWidth, "0.1", function (v) {
      s.frameWidth = parseFloat(v) || 0; save(); draw();
    })));
    g3.appendChild(row("Inset (mm)", input("number", s.frameInset, "1", function (v) {
      s.frameInset = parseFloat(v) || 0; save(); draw();
    })));
  }

  // ---------- buttons ----------

  document.getElementById("print").addEventListener("click", function () {
    var dims = SIZES[state.sheet.size] || SIZES.letter;
    var st = document.getElementById("pagesize") || document.createElement("style");
    st.id = "pagesize";
    st.textContent = "@page { size: " + dims[0] + "mm " + dims[1] + "mm; margin: 0; }";
    document.head.appendChild(st);
    window.print();
  });

  document.getElementById("reset").addEventListener("click", function () {
    if (!confirm("Reset every setting back to the starting sign?")) return;
    state = defaults();
    save();
    buildPanel();
    draw();
  });

  buildPanel();
  draw();
})();
</script>
</body>
</html>
